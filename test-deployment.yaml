apiVersion: v1
kind: Namespace
metadata:
  name: customer1
  labels:
    customer: customer1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: customer1
  labels:
    app: nginx-test
    customer: customer1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
        customer: customer1
    spec:
      # Ensure pods only run on customer1 nodes
      nodeSelector:
        customer: customer1
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: customer1
  labels:
    app: nginx-test
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: nginx-test
