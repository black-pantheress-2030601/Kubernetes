apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-critical-namespaces
  annotations:
    policies.kyverno.io/title: Protect Critical Namespaces
    policies.kyverno.io/description: >
      Prevents deletion of critical namespaces that host platform addons.
      Only ArgoCD or the Fleet agent (GitOps) can modify these namespaces.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: block-namespace-deletion
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              names:
                - kube-system
                - amazon-cloudwatch
                - networking
                - kyverno
                - argocd
                - cattle-system
                - cattle-fleet-system
                - cert-manager
                - monitoring
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: argocd-application-controller
                namespace: argocd
              - kind: ServiceAccount
                name: argocd-server
                namespace: argocd
              - kind: ServiceAccount
                name: fleet-agent
                namespace: cattle-fleet-system
              - kind: ServiceAccount
                name: rancher
                namespace: cattle-system
      validate:
        message: "Critical namespace '{{request.object.metadata.name}}' cannot be deleted. Managed by platform team."
        deny:
          conditions:
            any:
              - key: "{{request.operation}}"
                operator: Equals
                value: DELETE
