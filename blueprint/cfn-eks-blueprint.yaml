AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EKS Blueprint - Standalone cluster with managed node group, essential addons,
  and IAM roles for addon workloads (LB controller, logging, etc).

Parameters:
  ClusterName:
    Type: String

  KubernetesVersion:
    Type: String
    Default: "1.32"
    AllowedValues: ["1.31", "1.32"]

  VpcId:
    Type: AWS::EC2::VPC::Id

  Subnet1Id:
    Type: AWS::EC2::Subnet::Id
  Subnet2Id:
    Type: AWS::EC2::Subnet::Id
  Subnet3Id:
    Type: AWS::EC2::Subnet::Id

  NodeInstanceType:
    Type: String
    Default: t3.large

  NodeDesiredSize:
    Type: Number
    Default: 3

  NodeMinSize:
    Type: Number
    Default: 2

  NodeMaxSize:
    Type: Number
    Default: 6

  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: prod

Resources:

  # =========================================================================
  # Cluster IAM Role
  # =========================================================================

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # =========================================================================
  # Node IAM Role
  # =========================================================================

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # =========================================================================
  # AWS Load Balancer Controller IAM Role (Pod Identity)
  # =========================================================================

  LBControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-lb-controller-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: AWSLoadBalancerControllerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:*
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcPeeringConnections
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeInstances
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeTags
                  - ec2:DescribeCoipPools
                  - ec2:GetCoipPoolUsage
                  - ec2:DescribeTargetGroups
                  - ec2:DescribeTargetHealth
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - iam:CreateServiceLinkedRole
                  - cognito-idp:DescribeUserPoolClient
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - wafv2:GetWebACL
                  - wafv2:GetWebACLForResource
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - shield:GetSubscriptionState
                  - shield:DescribeProtection
                  - shield:CreateProtection
                  - shield:DeleteProtection
                Resource: "*"

  # =========================================================================
  # CloudWatch Observability IAM Role (Pod Identity)
  # =========================================================================

  CloudWatchObservabilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cloudwatch-observability-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AWSXRayWriteOnlyAccess

  # =========================================================================
  # EKS Cluster
  # =========================================================================

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref Subnet1Id
          - !Ref Subnet2Id
          - !Ref Subnet3Id
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: managed-by
          Value: eks-blueprint

  # =========================================================================
  # EKS Addons (Critical - cannot be removed)
  # =========================================================================

  AddonVpcCni:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE

  AddonCoreDns:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  AddonKubeProxy:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE

  AddonPodIdentity:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  AddonCloudWatchObservability:
    Type: AWS::EKS::Addon
    DependsOn:
      - EKSCluster
      - AddonPodIdentity
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: amazon-cloudwatch-observability
      ResolveConflicts: OVERWRITE

  # =========================================================================
  # Managed Node Group
  # =========================================================================

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - AddonVpcCni
      - AddonCoreDns
      - AddonKubeProxy
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub "${ClusterName}-nodes"
      NodeRole: !GetAtt NodeRole.Arn
      Subnets:
        - !Ref Subnet1Id
        - !Ref Subnet2Id
        - !Ref Subnet3Id
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeDesiredSize
        MinSize: !Ref NodeMinSize
        MaxSize: !Ref NodeMaxSize
      Labels:
        environment: !Ref Environment
        managed-by: eks-blueprint
      Tags:
        environment: !Ref Environment

  # =========================================================================
  # Pod Identity Associations
  # =========================================================================

  LBControllerPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: AddonPodIdentity
    Properties:
      ClusterName: !Ref EKSCluster
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: !GetAtt LBControllerRole.Arn

  CloudWatchObservabilityPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: AddonPodIdentity
    Properties:
      ClusterName: !Ref EKSCluster
      Namespace: amazon-cloudwatch
      ServiceAccount: cloudwatch-agent
      RoleArn: !GetAtt CloudWatchObservabilityRole.Arn

  # =========================================================================
  # EKS Access Entries - Scoped team access (no cluster-admin for teams)
  # =========================================================================

  # Node access entry
  NodeAccessEntry:
    Type: AWS::EKS::AccessEntry
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      PrincipalArn: !GetAtt NodeRole.Arn
      Type: EC2_LINUX

Outputs:
  ClusterName:
    Value: !Ref EKSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  ClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-Endpoint"

  ClusterArn:
    Value: !GetAtt EKSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Arn"

  NodeRoleArn:
    Value: !GetAtt NodeRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-NodeRoleArn"

  LBControllerRoleArn:
    Value: !GetAtt LBControllerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LBControllerRoleArn"

  CloudWatchObservabilityRoleArn:
    Value: !GetAtt CloudWatchObservabilityRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CloudWatchObservabilityRoleArn"
