---
# FluentBit configuration for sending logs to hub account CloudWatch
# Prerequisites:
#   - HubLoggingRoleArn configured in spoke cluster CFN template
#   - Pod Identity association created for fluent-bit service account

apiVersion: v1
kind: Namespace
metadata:
  name: kube-system  # FluentBit typically runs here

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: kube-system
  annotations:
    # Pod Identity will assume this role automatically
    # Role is created by spoke CloudFormation template
    description: "ServiceAccount for FluentBit to write logs to hub account"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            docker
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [FILTER]
        Name                nest
        Match               kube.*
        Operation           lift
        Nested_under        kubernetes
        Add_prefix          k8s_

    [FILTER]
        Name                modify
        Match               kube.*
        Add                 cluster_name ${CLUSTER_NAME}
        Add                 customer ${CUSTOMER_NAME}

    [OUTPUT]
        Name cloudwatch_logs
        Match *
        region ${HUB_REGION}
        log_group_name /aws/eks/all-customers
        log_stream_prefix ${CUSTOMER_NAME}-
        auto_create_group false
        role_arn ${HUB_LOGGING_ROLE_ARN}
        external_id centralized-logging
        log_retention_days 90

  parsers.conf: |
    [PARSER]
        Name   docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep Off

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: kube-system
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
      - name: fluent-bit
        image: public.ecr.aws/aws-observability/aws-for-fluent-bit:latest
        env:
        - name: CLUSTER_NAME
          value: "REPLACE_WITH_CLUSTER_NAME"  # Will be replaced by deploy script
        - name: CUSTOMER_NAME
          value: "REPLACE_WITH_CUSTOMER_NAME"
        - name: HUB_REGION
          value: "REPLACE_WITH_HUB_REGION"
        - name: HUB_LOGGING_ROLE_ARN
          value: "REPLACE_WITH_HUB_LOGGING_ROLE"
        - name: AWS_REGION
          value: "REPLACE_WITH_HUB_REGION"
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      tolerations:
      - effect: NoSchedule
        operator: Exists
