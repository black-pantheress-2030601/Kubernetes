---
# ResourceQuotas and LimitRanges per tenant namespace.
# Prevents a single tenant from consuming disproportionate cluster resources
# and ensures pods always have resource requests set (required for scheduling).
# Adjust cpu/memory values to match your SLA tiers before deploying.

# --- customer1 ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: tenant-customer1
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    services: "20"
    persistentvolumeclaims: "20"
    secrets: "50"
    configmaps: "50"
    services.loadbalancers: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: tenant-customer1
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi

