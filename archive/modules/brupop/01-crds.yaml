---
# BottlerocketShadow CRD — one instance per node, created by the brupop
# agent. Tracks the node's current Bottlerocket version and update state.
# The controller watches these objects to coordinate rolling OS updates.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bottlerocketshadows.brupop.bottlerocket.aws
  annotations:
    controller-gen.kubebuilder.io/version: v0.9.0
spec:
  group: brupop.bottlerocket.aws
  scope: Namespaced
  names:
    plural: bottlerocketshadows
    singular: bottlerocketshadow
    kind: BottlerocketShadow
    shortNames: ["brs"]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .spec.state
          description: Current update state of the node
        - name: Version
          type: string
          jsonPath: .spec.version
          description: Running Bottlerocket version
        - name: Target Version
          type: string
          jsonPath: .status.targetVersion
          description: Version being updated to (if in progress)
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: BottlerocketShadow tracks the update state of a single Bottlerocket node.
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [state, version]
              properties:
                state:
                  type: string
                  description: Desired update state for this node.
                  enum:
                    - Idle
                    - StagedAndPerformingUpdate
                    - StagedUpdate
                    - PerformedUpdate
                    - RebootingIntoUpdate
                    - MonitoringUpdate
                    - ErrorReset
                    - WaitingForUpdate
                version:
                  type: string
                  description: Current Bottlerocket OS version running on the node.
                  pattern: '^v\d+\.\d+\.\d+$'
                stateTransitionTimestamp:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                currentState:
                  type: string
                  description: Observed state of the update process.
                targetVersion:
                  type: string
                  description: Bottlerocket version the node is updating to.
                crashCount:
                  type: integer
                  description: Number of failed update attempts for the current target version.
                  default: 0
                suppressLockout:
                  type: boolean
                  description: Suppress the crash-count lockout for this node.
                  default: false
