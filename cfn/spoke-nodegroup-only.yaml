AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Spoke account - Nodegroup ONLY that joins a hub account EKS cluster.
  The EKS control plane lives in the hub account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Hub Cluster Configuration }
        Parameters: [HubAccountId, HubClusterName, HubClusterEndpoint, HubClusterCA, HubClusterSecurityGroupId]
      - Label: { default: Network }
        Parameters: [VpcId, Subnet1Id, Subnet2Id, Subnet3Id]
      - Label: { default: Node Configuration }
        Parameters: [NodeGroupName, CustomerName, BottlerocketAMIId, NodeInstanceType, NodeMinSize, NodeMaxSize, NodeDesiredSize, NodeVolumeSize]
      - Label: { default: Hub Services }
        Parameters: [HubECRRegion, HubLoggingRoleArn, HubPrometheusRoleArn]

Parameters:
  # Hub Cluster Connection
  HubAccountId:
    Type: String
    Description: AWS Account ID where the EKS cluster control plane exists

  HubClusterName:
    Type: String
    Description: Name of the EKS cluster in the hub account

  HubClusterEndpoint:
    Type: String
    Description: EKS cluster API endpoint URL (e.g., https://ABC123.gr7.us-east-1.eks.amazonaws.com)

  HubClusterCA:
    Type: String
    Description: Base64-encoded cluster CA certificate
    NoEcho: true

  HubClusterSecurityGroupId:
    Type: String
    Description: Security group ID of the hub EKS cluster (for node communication)

  # Node Configuration
  NodeGroupName:
    Type: String
    Default: customer1-nodes
    Description: Name for this node group

  CustomerName:
    Type: String
    Default: customer1
    Description: Customer identifier for tagging

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in spoke account (needs connectivity to hub cluster endpoint)

  Subnet1Id:
    Type: AWS::EC2::Subnet::Id
  Subnet2Id:
    Type: AWS::EC2::Subnet::Id
  Subnet3Id:
    Type: AWS::EC2::Subnet::Id

  BottlerocketAMIId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/bottlerocket/aws-k8s-1.32/x86_64/latest/image_id

  NodeInstanceType:
    Type: String
    Default: m5.large

  NodeMinSize:
    Type: Number
    Default: 2

  NodeMaxSize:
    Type: Number
    Default: 10

  NodeDesiredSize:
    Type: Number
    Default: 3

  NodeVolumeSize:
    Type: Number
    Default: 50

  # Hub Services
  HubECRRegion:
    Type: String
    Default: us-east-1
    Description: AWS region where hub ECR repositories exist

  HubLoggingRoleArn:
    Type: String
    Default: ""
    Description: ARN of cross-account logging role in hub account (optional)

  HubPrometheusRoleArn:
    Type: String
    Default: ""
    Description: ARN of cross-account Prometheus role in hub account (optional)

Conditions:
  HasLoggingRole: !Not [!Equals [!Ref HubLoggingRoleArn, ""]]
  HasPrometheusRole: !Not [!Equals [!Ref HubPrometheusRoleArn, ""]]

Resources:

  # =========================================================================
  # Security Groups (Spoke Account)
  # =========================================================================

  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NodeGroupName} security group"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${NodeGroupName}-sg"
        - Key: !Sub "kubernetes.io/cluster/${HubClusterName}"
          Value: owned
        - Key: customer
          Value: !Ref CustomerName

  NodeSecurityGroupIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref NodeSecurityGroup
      Description: Allow node to node communication

  # Note: With public endpoint, hub control plane reaches nodes over internet
  # Cross-account security group references don't work, so we allow all inbound on the ports
  NodeSecurityGroupIngressFromInternet1025:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 1025
      ToPort: 65535
      CidrIp: 0.0.0.0/0
      Description: Allow control plane to worker node communication

  NodeSecurityGroupIngressFromInternet443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Allow control plane to worker node webhook

  # =========================================================================
  # IAM Roles (Spoke Account)
  # =========================================================================

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NodeGroupName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # EBS CSI Driver permissions
        - PolicyName: EBSCSIDriverPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowDescribe
                Effect: Allow
                Action:
                  - ec2:CreateSnapshot
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:ModifyVolume
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeSnapshots
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeVolumesModifications
                Resource: "*"
              - Sid: AllowTagging
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource:
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:volume/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:snapshot/*"
              - Sid: AllowVolumeCreation
                Effect: Allow
                Action:
                  - ec2:CreateVolume
                Resource: "*"
              - Sid: AllowVolumeDeletion
                Effect: Allow
                Action:
                  - ec2:DeleteVolume
                  - ec2:DeleteSnapshot
                Resource: "*"
        # Cross-account ECR pull from hub
        - PolicyName: CrossAccountECRPull
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                Resource:
                  - !Sub "arn:aws:ecr:${HubECRRegion}:${HubAccountId}:repository/shared/*"
      Tags:
        - Key: customer
          Value: !Ref CustomerName
        - Key: hub-cluster
          Value: !Ref HubClusterName

  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${NodeGroupName}-profile"
      Roles: [!Ref NodeRole]

  # IAM Role for FluentBit (optional)
  FluentBitRole:
    Type: AWS::IAM::Role
    Condition: HasLoggingRole
    Properties:
      RoleName: !Sub "${NodeGroupName}-fluentbit-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: AssumeHubLoggingRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref HubLoggingRoleArn
                Condition:
                  StringEquals:
                    sts:ExternalId: centralized-logging
      Tags:
        - Key: customer
          Value: !Ref CustomerName

  # IAM Role for Prometheus (optional)
  PrometheusRole:
    Type: AWS::IAM::Role
    Condition: HasPrometheusRole
    Properties:
      RoleName: !Sub "${NodeGroupName}-prometheus-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: AssumeHubPrometheusRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref HubPrometheusRoleArn
                Condition:
                  StringEquals:
                    sts:ExternalId: centralized-monitoring
      Tags:
        - Key: customer
          Value: !Ref CustomerName

  # =========================================================================
  # Launch Template
  # =========================================================================

  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${NodeGroupName}-lt"
      LaunchTemplateData:
        ImageId: !Ref BottlerocketAMIId
        InstanceType: !Ref NodeInstanceType
        IamInstanceProfile:
          Arn: !GetAtt NodeInstanceProfile.Arn
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref NodeSecurityGroup
            DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            [settings.kubernetes]
            cluster-name = "${HubClusterName}"
            api-server = "${HubClusterEndpoint}"
            cluster-certificate = "${HubClusterCA}"

            [settings.kubernetes.node-labels]
            customer = "${CustomerName}"
            nodegroup = "${NodeGroupName}"
            account = "${AWS::AccountId}"

            [settings.kubernetes.node-taints]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
          - DeviceName: /dev/xvdb
            Ebs:
              VolumeSize: !Ref NodeVolumeSize
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${NodeGroupName}-node"
              - Key: !Sub "kubernetes.io/cluster/${HubClusterName}"
                Value: owned
              - Key: customer
                Value: !Ref CustomerName
              - Key: hub-account
                Value: !Ref HubAccountId
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "${NodeGroupName}-volume"
              - Key: customer
                Value: !Ref CustomerName

  # =========================================================================
  # Auto Scaling Group
  # =========================================================================

  NodeAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${NodeGroupName}-asg"
      LaunchTemplate:
        LaunchTemplateId: !Ref NodeLaunchTemplate
        Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
      MinSize: !Ref NodeMinSize
      MaxSize: !Ref NodeMaxSize
      DesiredCapacity: !Ref NodeDesiredSize
      VPCZoneIdentifier:
        - !Ref Subnet1Id
        - !Ref Subnet2Id
        - !Ref Subnet3Id
      Tags:
        - Key: Name
          Value: !Sub "${NodeGroupName}-node"
          PropagateAtLaunch: true
        - Key: !Sub "kubernetes.io/cluster/${HubClusterName}"
          Value: owned
          PropagateAtLaunch: true
        - Key: customer
          Value: !Ref CustomerName
          PropagateAtLaunch: true
        - Key: hub-account
          Value: !Ref HubAccountId
          PropagateAtLaunch: true

Outputs:
  NodeGroupName:
    Description: Node group name
    Value: !Ref NodeGroupName
    Export:
      Name: !Sub "${AWS::StackName}-NodeGroupName"

  NodeRoleArn:
    Description: Node IAM role ARN (add this to hub cluster Access Entries)
    Value: !GetAtt NodeRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-NodeRole"

  NodeSecurityGroupId:
    Description: Node security group ID
    Value: !Ref NodeSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-NodeSecurityGroup"

  AutoScalingGroupName:
    Description: Auto scaling group name
    Value: !Ref NodeAutoScalingGroup
    Export:
      Name: !Sub "${AWS::StackName}-ASG"

  FluentBitRoleArn:
    Condition: HasLoggingRole
    Description: FluentBit IAM role ARN for cross-account logging
    Value: !GetAtt FluentBitRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FluentBitRole"

  PrometheusRoleArn:
    Condition: HasPrometheusRole
    Description: Prometheus IAM role ARN for cross-account monitoring
    Value: !GetAtt PrometheusRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PrometheusRole"

  CustomerName:
    Description: Customer identifier
    Value: !Ref CustomerName
    Export:
      Name: !Sub "${AWS::StackName}-Customer"

  Instructions:
    Description: Next steps
    Value: !Sub |
      1. In hub account, add Access Entry: aws eks create-access-entry --cluster-name ${HubClusterName} --principal-arn ${NodeRole.Arn} --type EC2_LINUX
      2. Associate policy: aws eks associate-access-policy-association --cluster-name ${HubClusterName} --principal-arn ${NodeRole.Arn} --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSWorkerNodePolicy --access-scope type=cluster
      3. Verify nodes: kubectl get nodes --selector=customer=${CustomerName}
